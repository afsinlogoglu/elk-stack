input {
  file {
    path => "/logs/app.log"
    start_position => "beginning"
    sincedb_path => "/usr/share/logstash/data/sincedb"
    stat_interval => "1s"
    codec => json
  }
}

filter {
  if "_jsonparsefailure" in [tags] {
    mutate {
      add_field => { "parseError" => "true" }
    }
  } else {
    mutate {
      convert => {
        "statusCode" => "integer"
        "durationMs" => "integer"
      }
    }
    date {
      match => ["timestamp", "ISO8601"]
      target => "@timestamp"
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
    index => "backend-logs-%{+YYYY.MM.dd}"
  }
  stdout {
    codec => rubydebug
  }
}
